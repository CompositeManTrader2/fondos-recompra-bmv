name: Scanner diario de recompras BMV

on:
  schedule:
    # CDMX = UTC-6 (sin horario de verano desde 2022)
    - cron: "30 2 * * 2-6"    # 20:30 CDMX, lun-vie (después del cierre)
    - cron: "30 15 * * 1-5"   # 09:30 CDMX, lun-vie (reportes publicados tarde)
  workflow_dispatch:
    inputs:
      seed_id:
        description: "ID inicial para backfill (vacío = incremental). Ej: 1540000 ≈ mar-2026"
        required: false
        default: ""
      max_minutos:
        description: "Presupuesto de tiempo del scanner (min)"
        required: false
        default: "45"
      dry_run:
        description: "Dry run (no escribe ni commitea)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-scanner.txt

      - name: Instalar dependencias
        run: pip install -r requirements-scanner.txt

      - name: Ejecutar scanner y publicar datos
        env:
          SEED_ID: ${{ github.event.inputs.seed_id }}
          MAX_MIN: ${{ github.event.inputs.max_minutos || '45' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -u
          ARGS="--max-minutos ${MAX_MIN}"
          if [ -n "${SEED_ID}" ]; then ARGS="$ARGS --seed-id ${SEED_ID}"; fi
          if [ "${DRY_RUN}" = "true" ]; then ARGS="$ARGS --dry-run"; fi

          git config user.name  "recompras-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for intento in 1 2 3; do
            python scripts/daily_scan.py $ARGS || { rc=$?; [ $rc -eq 2 ] && echo "::warning::BMV no respondió"; }
            [ "${DRY_RUN}" = "true" ] && exit 0

            git add data/
            if git diff --cached --quiet; then
              echo "Sin cambios que publicar."; exit 0
            fi
            MSG=$(python -c "import json;r=json.load(open('data/daily/_state.json'))['runs'][0];print(f\"data(scan): {r['docs_nuevos']} docs · {r['ops_nuevas']:,} ops · {len(r['emisoras'])} emisoras\")")
            git commit -q -m "$MSG"
            if git push; then exit 0; fi

            # Otro commit entró mientras escaneábamos (p.ej. una carga desde la app):
            # partimos de lo último y re-ejecutamos (el scanner es idempotente).
            echo "::notice::Push rechazado; reintento ${intento} sobre origin/main"
            git fetch -q origin main && git reset -q --hard origin/main
          done
          echo "::error::No se pudo publicar tras 3 intentos"; exit 1
